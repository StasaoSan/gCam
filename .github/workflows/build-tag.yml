name: Build and publish gCam

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed gCam APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build and test
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleRelease

      - name: Resolve and verify release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [[ -z "$APP_VERSION" ]]; then
            echo "Cannot read versionName from app/build.gradle.kts" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            if [[ "$TAG_NAME" != "v${APP_VERSION}" ]]; then
              echo "Tag ${TAG_NAME} does not match app version v${APP_VERSION}" >&2
              exit 1
            fi
          else
            TAG_NAME="v${APP_VERSION}"
          fi

          if ! grep -Fq "## [${TAG_NAME}]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${TAG_NAME}" >&2
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "base_name=gCam_[${TAG_NAME}]" >> "$GITHUB_OUTPUT"

      - name: Sign release APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          BASE_NAME: ${{ steps.release.outputs.base_name }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Missing SIGNING_KEYSTORE_BASE64 secret}"
          : "${SIGNING_STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD secret}"
          : "${SIGNING_KEY_ALIAS:?Missing SIGNING_KEY_ALIAS secret}"
          : "${SIGNING_KEY_PASSWORD:?Missing SIGNING_KEY_PASSWORD secret}"
          mkdir -p dist
          KEYSTORE_FILE="${RUNNER_TEMP}/gcam-release.jks"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "dist/${BASE_NAME}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose \
            "dist/${BASE_NAME}.apk"

      - name: Prepare release notes
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          BASE_NAME: ${{ steps.release.outputs.base_name }}
        shell: bash
        run: |
          set -euo pipefail
          awk -v heading="## [${TAG_NAME}]" '
            $0 == heading || index($0, heading " - ") == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "dist/${BASE_NAME}_CHANGELOG.txt"

          test -s "dist/${BASE_NAME}_CHANGELOG.txt"

      - name: Upload temporary build for one day
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.base_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          BASE_NAME: ${{ steps.release.outputs.base_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" "dist/${BASE_NAME}.apk" \
            --verify-tag \
            --title "gCam ${TAG_NAME}" \
            --notes-file "dist/${BASE_NAME}_CHANGELOG.txt"
