name: Build and publish gCam

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish (leave empty to verify only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Keep debug APK for one day
        uses: actions/upload-artifact@v4
        with:
          name: gCam-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Sign and publish release APK
    if: ${{ github.ref_type == 'tag' || inputs.release_tag != '' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Prepare release version and notes
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          IFS=. read -r major minor patch revision <<< "$version"
          major=$((10#$major))
          minor=$((10#$minor))
          patch=$((10#${patch:-0}))
          revision=$((10#${revision:-0}))
          if (( major > 20 || minor > 999 || patch > 999 || revision > 99 )); then
            echo "Tag $tag cannot be encoded as an Android versionCode" >&2
            exit 1
          fi
          version_code=$((major * 100000000 + minor * 100000 + patch * 100 + revision))
          # The checked-out tag can contain an older Gradle version. The tag is
          # authoritative for the release APK; no tag rewriting is required.
          sed -i -E \
            -e "s/^([[:space:]]*versionCode = )[0-9]+/\\1${version_code}/" \
            -e "s/^([[:space:]]*versionName = )\"[^\"]+\"/\\1\"${version}\"/" \
            app/build.gradle.kts
          grep -Fq "versionCode = ${version_code}" app/build.gradle.kts
          grep -Fq "versionName = \"${version}\"" app/build.gradle.kts
          mkdir -p dist
          awk -v heading="## [${tag}]" '
            $0 == heading || index($0, heading " - ") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' dist/RELEASE_NOTES.md; then
            previous_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
            if [[ -n "$previous_tag" ]]; then
              git log --format='- %s' "${previous_tag}..${tag}" > dist/RELEASE_NOTES.md
            else
              git log -10 --format='- %s' "$tag" > dist/RELEASE_NOTES.md
            fi
          fi
          grep -q '[^[:space:]]' dist/RELEASE_NOTES.md
          echo "Release $tag: versionName=$version versionCode=$version_code"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=gCam_[${tag}].apk" >> "$GITHUB_OUTPUT"
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
      - name: Build release
        run: ./gradlew --no-daemon assembleRelease
      - name: Sign and verify APK
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          APK_NAME: ${{ steps.release.outputs.apk }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Missing SIGNING_KEYSTORE_BASE64 secret}"
          : "${SIGNING_STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD secret}"
          : "${SIGNING_KEY_ALIAS:?Missing SIGNING_KEY_ALIAS secret}"
          : "${SIGNING_KEY_PASSWORD:?Missing SIGNING_KEY_PASSWORD secret}"
          keystore="${RUNNER_TEMP}/gcam-release.jks"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "dist/${APK_NAME}" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "dist/${APK_NAME}"
          package_info="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "dist/${APK_NAME}")"
          package_line="${package_info%%$'\n'*}"
          expected="package: name='com.stasao.gcam' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          if [[ "$package_line" != "$expected"* ]]; then
            echo "Unexpected APK metadata: $package_line" >&2
            exit 1
          fi
          shasum -a 256 "dist/${APK_NAME}" > dist/SHA256SUMS.txt
      - name: Keep signed APK for one day
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          APK_NAME: ${{ steps.release.outputs.apk }}
        run: |
          set -euo pipefail
          test -f "dist/${APK_NAME}"
          # gh treats square brackets in an exact filename as a glob character class.
          # Let gh expand a pattern that matches the one signed APK instead.
          apk_pattern='dist/gCam_*.apk'
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$apk_pattern" dist/SHA256SUMS.txt \
              --clobber
            gh release edit "$TAG_NAME" \
              --title "gCam ${TAG_NAME}" --notes-file dist/RELEASE_NOTES.md --draft=false
          else
            gh release create "$TAG_NAME" "$apk_pattern" dist/SHA256SUMS.txt \
              --verify-tag \
              --title "gCam ${TAG_NAME}" --notes-file dist/RELEASE_NOTES.md
          fi
