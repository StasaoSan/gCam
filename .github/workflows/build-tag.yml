name: Build tagged APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build gCam APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build and test
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Prepare tagged APK
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/gCam-${TAG_NAME}.apk"

      - name: Upload APK for one day
        uses: actions/upload-artifact@v4
        with:
          name: gCam-${{ github.ref_name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
