name: Build and publish gCam

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Keep debug APK for one day
        uses: actions/upload-artifact@v4
        with:
          name: gCam-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Sign and publish release APK
    if: ${{ github.ref_type == 'tag' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and changelog
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){1,3}$ || "$tag" != "v${version}" ]]; then
            echo "Tag $tag must match app version v${version}" >&2
            exit 1
          fi
          mkdir -p dist
          awk -v heading="## [${tag}]" '
            $0 == heading || index($0, heading " - ") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' dist/RELEASE_NOTES.md; then
            echo "CHANGELOG.md has no notes for $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=gCam_[${tag}].apk" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
      - name: Build release
        run: ./gradlew --no-daemon assembleRelease
      - name: Sign and verify APK
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          APK_NAME: ${{ steps.release.outputs.apk }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Missing SIGNING_KEYSTORE_BASE64 secret}"
          : "${SIGNING_STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD secret}"
          : "${SIGNING_KEY_ALIAS:?Missing SIGNING_KEY_ALIAS secret}"
          : "${SIGNING_KEY_PASSWORD:?Missing SIGNING_KEY_PASSWORD secret}"
          keystore="${RUNNER_TEMP}/gcam-release.jks"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "dist/${APK_NAME}" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "dist/${APK_NAME}"
          shasum -a 256 "dist/${APK_NAME}" > dist/SHA256SUMS.txt
      - name: Keep signed APK for one day
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          APK_NAME: ${{ steps.release.outputs.apk }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "dist/${APK_NAME}" dist/SHA256SUMS.txt \
              --clobber
            gh release edit "$TAG_NAME" \
              --title "gCam ${TAG_NAME}" --notes-file dist/RELEASE_NOTES.md --draft=false
          else
            gh release create "$TAG_NAME" "dist/${APK_NAME}" dist/SHA256SUMS.txt \
              --verify-tag \
              --title "gCam ${TAG_NAME}" --notes-file dist/RELEASE_NOTES.md
          fi
